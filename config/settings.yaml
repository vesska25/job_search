  foreign_locations:
    [Amsterdam, London, Paris, Luxembourg, Luxemburg, Brussels, Brüssel, Zurich, Zürich, Vienna, Wien, Warsaw,
     Warschau, Madrid, Barcelona, Milan, Mailand, Rome, Dublin, Prague, Budapest, Stockholm, Copenhagen,
     Oslo, Helsinki, Lisbon, Athens, Geneva, Genf, Basel, New York, Singapore, Hong Kong, Tokyo, Mumbai,
     Bucharest, Sofia, Istanbul, Bratislava, Vilnius, Riga, Tallinn, Lyon, Rotterdam, Utrecht, Edinburgh,
     Manchester, Poland, Netherlands, France, Switzerland, Austria, Spain, Italy, Ireland, United Kingdom,
     Frankreich, Schweiz, Österreich, Niederlande, Großbritannien, Vereinigtes Königreich, Spanien, Italien, Irland,
     Polen, Belgien, Tschechien, Ungarn, Singapur, USA, Vereinigte Staaten]

llm:
  enabled: false               # needs ANTHROPIC_API_KEY when true
  model: claude-haiku-4-5-20251001
  min_confidence: 0.7
  max_calls_per_run: 50        # hard cap so costs stay predictable
  timeout: 30

http:
  user_agent: "bank-job-monitor/1.0 (personal job-alert tool; weekly run; respects robots.txt)"
  timeout: 20
  retries: 3
  min_delay_seconds: 1.0       # per host
  respect_robots_txt: true
  max_pages: 30

telegram:
  mode: digest                 # digest | individual
  send_empty_digest: true
  max_jobs_in_digest: 40

database:
  path: data/jobs.db

# Extra recipients. 'main' (leadership roles in Finance / Risk / Regulatory / Treasury / Organisation & IT) is built in and
# goes to TELEGRAM_CHAT_ID. Every profile below is evaluated on the same scraped vacancies, has its own "already sent"
# table and its own Telegram chat (the chat id is read from the environment variable named in chat_id_env).
# A vacancy matches when the title has a `tech` term AND a `level` term and none of the `exclude` terms
# (whole words, case-insensitive: "Java" does not match "JavaScript"). Location filter: same as above.
profiles:
  sergey:
    enabled: true
    title: "JUNIOR JAVA - BANK JOBS"
    empty_text: "No new junior Java vacancies in banks this week."
    chat_id_env: TELEGRAM_CHAT_ID_SERGEY
    max_jobs_in_digest: 40
    level_in_description: true        # also look for the level words in the first 600 characters of the description
    accept_unspecified_level: true    # Java title without a level word is shown too, flagged (borderline)
    tech: [Java, J2EE, Jakarta EE, Spring Boot]
    role_terms:                       # generic developer titles: accepted only if Java is in the description
      - Software Engineer
      - Software Developer
      - Softwareentwickler
      - Softwareentwicklerin
      - Backend Developer
      - Backend Engineer
      - Entwickler
      - Entwicklerin
      - Tester
      - Testerin
      - Software Tester
      - QA Engineer
    level:
      - Junior
      - Jr
      - Berufseinsteiger
      - Berufseinsteigerin
      - Berufseinstieg
      - Einsteiger
      - Absolvent
      - Absolventin
      - Entry Level
      - Entry-Level
      - Graduate
      - Trainee
      - Young Professional
      - Nachwuchs
      - Berufsanfänger
      - Berufsanfängerin
      - Hochschulabsolvent
      - Hochschulabsolventin
      - Quereinsteiger
      - Einstieg
    exclude:
      - Senior
      - Lead
      - Principal
      - Head
      - Director
      - Architect
      - Experte
      - Expert
      - Leiter
      - Leiterin
      - Leitung
      - Teamleiter
      - Abteilungsleiter
      - Manager
      - Consultant
      - Berater
      - Werkstudent
      - Werkstudentin
      - Working Student
      - Praktikant
      - Praktikantin
      - Praktikum
      - Intern
      - Internship
      - Ausbildung
      - Auszubildende
      - Azubi
      - Duales Studium
