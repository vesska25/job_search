     Mannheim, Augsburg, Kassel, Darmstadt, Offenbach, Eschborn, Bad Homburg, Neu-Isenburg, Oberursel, Kronberg,
     Hanau, Aschaffenburg, Neuss, Leverkusen, Bergisch Gladbach, Mönchengladbach, Solingen, Remscheid, Krefeld,
     Aachen, Koblenz, Trier, Ludwigshafen, Heidelberg, Freiburg, Ulm, Regensburg, Würzburg, Erfurt, Potsdam,
     Rostock, Kiel, Lübeck, Magdeburg, Halle, Chemnitz, Saarbrücken, Oldenburg, Osnabrück, Braunschweig,
