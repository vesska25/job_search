# All matching is case-insensitive. Edit freely; no filter logic is hard-coded in Python.

filters:
  # Titles containing one of these are clearly leadership roles.
  seniority_keywords:
    - Head
    - Head of
    - Director
    - Executive Director
    - Managing Director
    - Department Head
    - Function Head
    - Team Lead
    - Team Leader
    - Lead
    - Leiter
    - Leiterin
    - Leitung
    - Bereichsleiter
    - Bereichsleiterin
    - Bereichsdirektor
    - Bereichsdirektorin
    - Abteilungsleiter
    - Abteilungsleiterin
    - Abteilungsleitung
    - Gruppenleiter
    - Gruppenleiterin
    - Gruppenleitung
    - Teamleiter
    - Teamleiterin
    - Teamleitung
    - Referatsleiter
    - Referatsleiterin
    - Direktor
    - Direktorin
    - Prokurist
    - Chief
    - Geschäftsführer
    - Geschäftsführerin

  # German compounds: these also match as the END of a longer word (e.g. "Risikobereichsleiter").
  compound_suffix_keywords: [Leiter, Leiterin, Leitung, Direktor, Direktorin, Gruppenleiter, Teamleiter]
  # ...except for these words (false friends / project roles that are not people leadership).
  compound_exclusions: [Anleitung, Einleitung, Ableitung, Projektleiter, Projektleiterin, Projektleitung, Produktleiter]

  # Titles that MAY be leadership. Accepted only if the description shows management
  # responsibility (see management_signals); otherwise treated as borderline (see borderline_policy).
  ambiguous_seniority_keywords:
    - Senior Manager
    - Group Manager
    - Vice President
    - VP
    - Principal
    - Projektleiter
    - Projektleiterin
    - Projektleitung

  # Plain "Manager" is far too common (Account Manager, Tax Manager ...): accepted ONLY when the
  # description shows people management; never by borderline_policy.
  weak_seniority_keywords:
    - Manager
    - Managerin

  # For ambiguous/weak titles the relevant function must appear in the TITLE
  # (not just in the department/category). Set false to also accept department matches.
  ambiguous_requires_title_function: true

  # Phrases in the description signalling people management.
  management_signals:
    - disziplinarische
    - Personalverantwortung
    - Führungsverantwortung
    - fachliche Führung
    - Führung eines Teams
    - Mitarbeiterführung
    - direct reports
    - line management
    - people management
    - leading a team
    - lead a team
    - manage a team
    - team of

  # A plain "Manager" title (weak) with one of these functions IN THE TITLE and no management signal is shown as
  # borderline instead of being dropped (Risk and IT only; "Fund Manager ... Infrastructure" etc. stay out).
  weak_borderline_functions:
    - Risk
    - Risiko
    - Risk Management
    - Risikomanagement
    - Risk Controlling
    - Risikocontrolling
    - CRO
    - Enterprise Risk Management
    - IT
    - IT-Management
    - IT Management
    - IT-Strategie
    - IT Strategy
    - IT Governance
    - IT-Steuerung
    - IT-Betrieb
    - IT Operations
    - IT-Sicherheit
    - IT Security
    - Informationssicherheit
    - Information Security
    - Cybersecurity
    - Cyber Security
    - Informationstechnologie
    - Information Technology
    - Application Management
    - IT-Infrastruktur
    - Enterprise Architecture

  # What to do with ambiguous-seniority roles that have a relevant function but no clear signal:
  #   include = report them, flagged "(borderline)"; reject = drop them. (An LLM, if enabled, decides first.)
  borderline_policy: include

  # Relevant functions. Words shorter than 5 characters must match as whole words;
  # longer ones match as substrings (so "Controlling" also matches "Risikocontrolling").
  relevant_functions:
    # Finance
    - Finance
    - Finanzen
    - Financial Controlling
    - Controlling
    - Group Controlling
    - Finance Steering
    - FP&A
    - CFO
    - CFO Office
    - Financial Planning
    - Management Reporting
    # Risk
    - Risk
    - Risiko
    - Risk Management
    - Risikomanagement
    - Risk Controlling
    - Risikocontrolling
    - CRO
    - CRO Office
    - ICAAP
    - Capital Management
    - Capital Planning
    - Capital Adequacy
    - Kapitalmanagement
    - Risk Appetite
    - Enterprise Risk Management
    - Gesamtbanksteuerung
    - Banksteuerung
    - Gesamtbankcontrolling
    - Bankcontrolling
    # Regulatory
    - Regulatory Reporting
    - Prudential Reporting
    - Regulatory Affairs
    - Regulatory
    - Aufsichtsrecht
    - Meldewesen
    - COREP
    - FINREP
    - CRR
    - CRR3
    - Capital Requirements
    - RWA
    # Other
    - Treasury
    - Liquidity
    - Liquidität
    - Balance Sheet Management
    - Bilanzstrukturmanagement
    - BCBS239
    - BCBS 239
    - Finance Transformation
    - Data Management
    - Finance Data
    - Regulatory Change
    # Organisation und IT
    - Organisation
    - Organisationsentwicklung
    - Organization
    - Organisational
    - IT
    - IT-Management
    - IT Management
    - IT-Strategie
    - IT Strategy
    - IT Governance
    - IT-Steuerung
    - IT-Betrieb
    - IT Operations
    - IT-Sicherheit
    - IT Security
    - Informationssicherheit
    - Information Security
    - Cybersecurity
    - Cyber Security
    - Informationstechnologie
    - Information Technology
    - Technology
    - Technologie
    - Digitalisierung
    - Digital Transformation
    - Prozessmanagement
    - Process Management
    - Geschäftsprozess
    - Business Process
    - Application Management
    - Anwendungsentwicklung
    - Software Development
    - Software Engineering
    - Infrastructure
    - IT-Infrastruktur
    - Enterprise Architecture
    - Unternehmensarchitektur

  # Phrases removed from the text before function matching (avoids false positives such as "Capital Markets").
  irrelevant_function_phrases:
    - Capital Markets
    - Kapitalmarkt
    - Private Equity
    - Venture Capital
    - Human Capital

  # Where functions are searched. If none found there, the description counts only with >= N hits.
  function_fields: [title, department]
  description_min_hits: 3

  # Always rejected, even if a leadership word is present.
  hard_exclusions:
    - Intern
    - Internship
    - Praktikant
    - Praktikantin
    - Praktikum
    - Werkstudent
    - Werkstudentin
    - Working Student
    - Junior
    - Trainee
    - Auszubildende
    - Azubi
    - Duales Studium

  # Rejected unless a STRONG leadership keyword is also in the title
  # ("Senior Specialist ..." is out; "Head of Expert Network" stays in).
  exclusions:
    - Analyst
    - Specialist
    - Senior Specialist
    - Expert
    - Senior Expert
    - Consultant
    - Associate
    - Referent
    - Sachbearbeiter
    - Spezialist
    - Experte

