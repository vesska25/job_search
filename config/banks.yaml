  verification_status: unverified
  last_verified: null
  notes: 'Search page supplied by the user (https://www.ruv.de/karriere/jobsuche?...). The page script calls the site own JSON search https://www.ruv.de/.search?index=job (probe HTTP 200: {searchResults[{title,
    location,jobId,url,careerLevel,jobCategory,date}], aggregations, total}); filter.careerLevel=Fuehrungskraefte (spelled with umlaut) selects the leadership level (11 of 1470 vacancies, 5 of them in Wiesbaden).
    Page size is 10; the page parameter is `page` (page=2 returned the 11th vacancy, probe). The earlier SmartRecruiters route was stopped by its robots check and is no longer used. IDs are the relative URLs
    (the same jobId is repeated per location). Only the leadership level is read on purpose; leaders titled under other levels would be missed. Unverified until a dry-run.'
  options:
    api_url: https://www.ruv.de/.search
    params: {index: job, filter.careerLevel: Führungskräfte}
    items_path: searchResults
    fields: {title: title, id: url, location: location, department: jobCategory, date: date, url: no_such_field}
    url_template: https://www.ruv.de{url}
    pagination: {type: page, param: page, total_path: total, in: params, max_pages: 10}
    regions: [rhein_main, koeln]
