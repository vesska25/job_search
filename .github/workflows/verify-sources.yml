name: Verify bank sources (manual)

on:
  workflow_dispatch:
    inputs:
      discover:
        description: "Discovery mode: probe Personio/SmartRecruiters for banks without a source"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify / discover and update banks.yaml
        run: python -m tools.verify_banks --apply ${{ inputs.discover && '--discover' || '' }}
      - name: Commit results
        run: |
          if [ -n "$(git status --porcelain config/banks.yaml)" ]; then
            git config user.name "job-monitor-bot"
            git config user.email "job-monitor-bot@users.noreply.github.com"
            git add config/banks.yaml
            git commit -m "chore: update bank source verification results"
            git push
          fi
