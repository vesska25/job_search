# Workflow definition (re-registered after initial push)
name: Weekly bank job monitor

on:
  schedule:
    # GitHub delays or drops scheduled runs that start exactly on the hour, so the minutes are off-peak.
    - cron: "7 15 * * 5"       # main: every Friday 15:07 UTC = 17:07 CEST (summer) / 16:07 CET (winter)
    - cron: "12 17 * * 5"      # backup 1: Friday 17:12 UTC, in case the main run never started
    - cron: "42 6 * * 6"       # backup 2: Saturday 06:42 UTC
    # A backup after a successful main run sends nothing: only vacancies not yet in the database are new.
  workflow_dispatch:
    inputs:
      baseline:
        description: "First run: store current matches as already notified (no Telegram flood)"
        type: boolean
        default: false
      dry_run:
        description: "Dry run: scrape and filter, log matches, no Telegram, no database changes"
        type: boolean
        default: false
      resend:
        description: "Send ALL current matches (not only new ones) to the selected profiles, then store them as sent"
        type: boolean
        default: false
      resend_before:
        description: "Also send known vacancies whose stored 'sent' date is before this date (YYYY-MM-DD), e.g. what a baseline run only marked as sent"
        type: string
        default: ""
      profile:
        description: "Only this recipient profile (main = leadership, sergey = junior Java); empty = all"
        type: string
        default: ""
      banks:
        description: "Only these bank ids, comma-separated (e.g. commerzbank,deutsche_bank); empty = all enabled banks"
        type: string
        default: ""
      learn_health:
        description: "Scrape everything and store each source's vacancy count as the health baseline (no Telegram, no vacancy records); run once so later changes of a career page are flagged"
        type: boolean
        default: false
      test_telegram:
        description: "Delivery test: send a sample digest of stored vacancies to Telegram, no scraping, no database changes"
        type: boolean
        default: false

permissions:
  contents: write              # needed to commit data/jobs.db back

concurrency:
  group: job-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_SERGEY: ${{ secrets.TELEGRAM_CHAT_ID_SERGEY }}   # second recipient (profile "sergey")
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional, only if llm.enabled
          BANKS: ${{ inputs.banks }}
        run: |
          ARGS=""
          for b in ${BANKS//,/ }; do ARGS="$ARGS --bank $b"; done
          python -m src.main ${{ inputs.baseline && '--baseline' || '' }} ${{ inputs.dry_run && '--dry-run --verbose' || '' }} ${{ inputs.test_telegram && '--test-telegram' || '' }} ${{ inputs.learn_health && '--learn-health' || '' }} --report reports/source-health.html ${{ inputs.resend && '--resend' || '' }} ${{ inputs.resend_before && format('--resend-before {0}', inputs.resend_before) || '' }} ${{ inputs.profile && format('--profile {0}', inputs.profile) || '' }} $ARGS
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-report
          path: reports/source-health.html
          if-no-files-found: ignore
          retention-days: 90
      - name: Persist database
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/jobs.db)" ]; then
            git config user.name "job-monitor-bot"
            git config user.email "job-monitor-bot@users.noreply.github.com"
            git add data/jobs.db
            git commit -m "chore: update seen-jobs database [skip ci]"
            # data/jobs.db is binary: if the branch moved during the run, keep this run's database instead of failing the rebase
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
            done
          fi
