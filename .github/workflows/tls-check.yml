name: TLS check (manual)

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Host to inspect (certificate chain, missing intermediate; verification is never disabled)"
        required: true

permissions:
  contents: read

jobs:
  tls:
    runs-on: ubuntu-latest
    steps:
      - name: Certificate chain as sent by the server
        run: |
          echo | openssl s_client -connect "${{ inputs.host }}:443" -servername "${{ inputs.host }}" -showcerts 2>&1 \
            | grep -E "^( [0-9] s:|   i:|Verification|Verify return)" | head -20
      - name: Issuer certificate named in the leaf (AIA), as PEM
        run: |
          echo | openssl s_client -connect "${{ inputs.host }}:443" -servername "${{ inputs.host }}" 2>/dev/null | openssl x509 > leaf.pem
          openssl x509 -in leaf.pem -noout -subject -issuer -dates
          URL=$(openssl x509 -in leaf.pem -noout -ext authorityInfoAccess | grep "CA Issuers" | head -1 | sed 's/.*URI://')
          echo "AIA issuer URL: $URL"
          curl -sS -m 20 -L "$URL" -o ca.bin
          (openssl x509 -inform DER -in ca.bin 2>/dev/null || openssl x509 -in ca.bin) > ca.pem
          openssl x509 -in ca.pem -noout -subject -issuer -dates
          echo "----- PEM -----"
          cat ca.pem
          echo "----- verify leaf with this intermediate + system roots -----"
          openssl verify -untrusted ca.pem leaf.pem
