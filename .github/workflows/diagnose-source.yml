name: Diagnose bank source (manual)

on:
  workflow_dispatch:
    inputs:
      bank:
        description: "Bank id(s) from banks.yaml, comma-separated (e.g. abn_amro,bnp_paribas,commerzbank,deutsche_bank)"
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tools.diagnose_source --bank "${{ inputs.bank }}"
