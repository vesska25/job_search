name: Diagnose bank source (manual)

on:
  workflow_dispatch:
    inputs:
      bank:
        description: "Bank id(s) from banks.yaml, comma-separated (optional if url is given)"
        required: false
        default: ""
      brief:
        description: "Shorter output (true/false)"
        required: false
        default: "false"
      context:
        description: "Characters of context around each pattern match (default 220)"
        required: false
        default: "220"
      pattern:
        description: "Regex searched in .js URLs (optional)"
        required: false
        default: ""
      url:
        description: "Page URL(s), comma-separated (optional if bank is given)"
        required: false
        default: ""

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Diagnose
        env:
          BANK: ${{ inputs.bank }}
          URLS: ${{ inputs.url }}
          PATTERN: ${{ inputs.pattern }}
          CONTEXT: ${{ inputs.context }}
          BRIEF: ${{ inputs.brief }}
        run: python -m tools.diagnose_source ${BANK:+--bank "$BANK"} ${URLS:+--url "$URLS"} ${PATTERN:+--pattern "$PATTERN"} ${CONTEXT:+--context "$CONTEXT"} $([ "$BRIEF" = "true" ] && echo --brief)
